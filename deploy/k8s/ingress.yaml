apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nano-banana
  namespace: nano-banana
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: banana.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nano-banana-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nano-banana-web
                port:
                  number: 80
