# Host nginx: static only for clicker images.
# No upload endpoints. Files owned by root, nginx cannot write.

server {
    listen 80;
    server_name uploader.ooneclickk.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uploader.ooneclickk.ru;

    ssl_certificate /etc/letsencrypt/live/uploader.ooneclickk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploader.ooneclickk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/uploader;
    autoindex off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=3600" always;

    location = / {
        return 404;
    }

    location /tsum-images/ {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
