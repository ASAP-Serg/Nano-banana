# uploader.ooneclickk.ru — PHP job uploader + static tsum-images + /files

server {
    listen 80;
    server_name uploader.ooneclickk.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uploader.ooneclickk.ru;

    ssl_certificate /etc/letsencrypt/live/uploader.ooneclickk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploader.ooneclickk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/uploader;
    index index.php;
    autoindex off;
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 404;
    }

    location /tsum-images/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /files/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # CSV exports written by job_status.php into jobs/
    location ^~ /jobs/ {
        limit_except GET HEAD { deny all; }
        types { text/csv csv; }
        default_type text/csv;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location ~ ^/(upload_by_url|job_start|job_status|job_result)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        return 404;
    }
}
