# Host nginx in front of docker web (127.0.0.1:8000).
# Overwrite X-Real-IP — never trust the client-supplied header.

server {
    listen 80;
    server_name ooneclickk.ru www.ooneclickk.ru;
    return 301 https://ooneclickk.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ooneclickk.ru www.ooneclickk.ru;

    ssl_certificate /etc/letsencrypt/live/ooneclickk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ooneclickk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    if ($host = www.ooneclickk.ru) {
        return 301 https://ooneclickk.ru$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}
