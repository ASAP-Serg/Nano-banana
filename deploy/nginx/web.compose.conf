server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    client_max_body_size 50m;

    # Security headers (CSP — на web, не «мертвые» флаги в API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.ooneclickk.ru https://replicate.delivery https://*.replicate.delivery; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://ooneclickk.ru https://storage.ooneclickk.ru https://api.moonez.ai https://cdn.moonez.ai https://openrouter.ai https://api.replicate.com; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Публичный liveness только. /readyz с postgres/redis/s3 — не наружу.
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        return 404;
    }

    # Не отдавать SPA на «секретных» путях (иначе /.env → 200 HTML и паника у аудита).
    location ~* /\.(env|git|htaccess|htpasswd) {
        return 404;
    }
    location ~* \.(ya?ml|env|sql|bak|pem|key)$ {
        return 404;
    }
    location = /docker-compose.yml { return 404; }
    location = /Dockerfile { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
