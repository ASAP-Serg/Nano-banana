# Host nginx (127.0.0.1:8000) must set X-Real-IP to the real client ($remote_addr).
# We forward that header instead of overwriting it with the docker gateway IP.
map $http_x_real_ip $nb_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    client_max_body_size 50m;

    # Security headers (CSP — на web, не «мертвые» флаги в API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Публичный liveness только. /readyz с postgres/redis/s3 — не наружу.
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $nb_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $nb_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        return 404;
    }

    # Не отдавать SPA на «секретных» путях (иначе /.env → 200 HTML и паника у аудита).
    location ~* /\.(env|git|htaccess|htpasswd) {
        return 404;
    }
    location ~* \.(ya?ml|env|sql|bak|pem|key)$ {
        return 404;
    }
    location = /docker-compose.yml { return 404; }
    location = /Dockerfile { return 404; }
    # Типичные recon-пути — не отдавать index.html
    location = /actuator { return 404; }
    location = /graphql { return 404; }
    location = /graphiql { return 404; }
    location = /swagger.json { return 404; }
    location = /openapi.json { return 404; }
    location = /swagger { return 404; }
    location = /swagger-ui { return 404; }
    location = /swagger-ui.html { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /metrics { return 404; }
    location = /console { return 404; }
    location = /admin { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $nb_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
