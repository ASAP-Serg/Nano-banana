# Host nginx for storage.ooneclickk.ru — only presigned object GETs.
# MinIO API (PUT/POST/DELETE/List) must NOT be public.

server {
    listen 80;
    server_name storage.ooneclickk.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name storage.ooneclickk.ru;

    ssl_certificate /etc/letsencrypt/live/storage.ooneclickk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.ooneclickk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location = /console { return 404; }
    location /console/ { return 404; }
    location = /minio { return 404; }
    location /minio/ { return 404; }

    location / {
        # Only browser/CDN downloads of already-presigned objects.
        limit_except GET HEAD {
            deny all;
        }

        # $args is the raw query string. $arg_X_Amz_* is empty in this nginx.
        if ($args !~* X-Amz-Algorithm=) {
            return 403;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;
        add_header Access-Control-Allow-Origin "https://ooneclickk.ru" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
        add_header Vary "Origin" always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
