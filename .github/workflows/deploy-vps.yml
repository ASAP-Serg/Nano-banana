name: Deploy VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Personal AdminVPS only. Never run against the org copy.
jobs:
  deploy:
    if: github.repository == 'ASAP-Serg/Nano-banana'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AdminVPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SALARIS_API_KEY: ${{ secrets.SALARIS_API_KEY }}
          SALARIS_MOSAICA_EMAIL: ${{ secrets.SALARIS_MOSAICA_EMAIL }}
          SALARIS_MOSAICA_PASSWORD: ${{ secrets.SALARIS_MOSAICA_PASSWORD }}
          SALARIS_GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.SALARIS_GOOGLE_SHEETS_CREDENTIALS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 45m
          envs: SALARIS_API_KEY,SALARIS_MOSAICA_EMAIL,SALARIS_MOSAICA_PASSWORD,SALARIS_GOOGLE_SHEETS_CREDENTIALS
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"
            echo "Deploy path: $(pwd)"
            echo "Target SHA: ${{ github.sha }}"

            git remote -v
            git fetch origin master
            git reset --hard "${{ github.sha }}"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing on server"
              exit 1
            fi
            if ! grep -qE '^REDIS_PASSWORD=.+' .env; then
              echo "ERROR: REDIS_PASSWORD empty in .env"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # Avoid "removal already in progress" races when a previous deploy
            # or manual restart is mid-recreate.
            $DC stop api worker web migrate 2>/dev/null || true
            docker rm -f nano_banana_migrate nano_banana_worker nano_banana_api nano_banana_web 2>/dev/null || true
            sleep 2

            up_ok=0
            for attempt in 1 2 3; do
              if $DC up -d --build --remove-orphans; then
                up_ok=1
                break
              fi
              echo "compose up failed (attempt $attempt), retrying…"
              sleep 5
              docker rm -f nano_banana_migrate nano_banana_worker nano_banana_api nano_banana_web 2>/dev/null || true
            done
            if [ "$up_ok" -ne 1 ]; then
              echo "ERROR: docker compose up failed after retries"
              exit 1
            fi

            sleep 25
            $DC ps

            missing=0
            for name in nano_banana_api nano_banana_worker nano_banana_web nano_banana_redis nano_banana_postgres; do
              if ! docker ps --format '{{.Names}}' | grep -qx "$name"; then
                echo "ERROR: $name is not running"
                docker logs "$name" --tail 80 2>/dev/null || true
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || echo 000)
            echo "Healthz: HTTP $code"
            if [ "$code" != "200" ]; then
              docker logs nano_banana_api --tail 100
              docker logs nano_banana_web --tail 40
              exit 1
            fi

            # PHP uploader app + clicker static → /var/www/uploader
            sudo mkdir -p /var/www/uploader/tsum-images /var/www/uploader/files /var/www/uploader/jobs
            if [ -d deploy/uploader-app ]; then
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                php-fpm php-cli php-curl php-gd php-mbstring php-xml php-zip
              # Prefer 8.3 sock; fall back to whatever php-fpm provides.
              PHP_SOCK="$(ls /run/php/php*-fpm.sock 2>/dev/null | head -n1 || true)"
              if [ -n "$PHP_SOCK" ] && [ -f deploy/nginx/uploader.ooneclickk.ru.conf ]; then
                sudo sed "s#unix:/run/php/php8.3-fpm.sock#unix:${PHP_SOCK}#" \
                  deploy/nginx/uploader.ooneclickk.ru.conf \
                  | sudo tee /etc/nginx/sites-available/uploader.ooneclickk.ru >/dev/null
                sudo ln -sfn /etc/nginx/sites-available/uploader.ooneclickk.ru \
                  /etc/nginx/sites-enabled/uploader.ooneclickk.ru
              fi
              sudo rsync -a \
                --exclude 'files/' --exclude 'jobs/' --exclude 'tsum-images/' \
                --exclude 'config.local.php' \
                deploy/uploader-app/ /var/www/uploader/
              sudo mkdir -p /var/www/uploader/files /var/www/uploader/jobs
            fi
            if [ -d deploy/uploader-static/tsum-images ]; then
              sudo rsync -a --delete deploy/uploader-static/tsum-images/ /var/www/uploader/tsum-images/
            fi
            sudo chown -R www-data:www-data /var/www/uploader/files /var/www/uploader/jobs
            sudo chown -R root:root /var/www/uploader/tsum-images
            sudo find /var/www/uploader -type d -exec chmod 755 {} \;
            sudo find /var/www/uploader -type f -exec chmod 644 {} \;
            sudo chmod 775 /var/www/uploader/files /var/www/uploader/jobs
            echo "Uploader diag:"
            sudo grep -n "function upload_one" /var/www/uploader/job_status.php || true
            sudo sed -n '75,95p' /var/www/uploader/job_status.php || true
            echo "Recent jobs:"
            sudo ls -lt /var/www/uploader/jobs/*.json 2>/dev/null | head -8 || true
            # Show last failed job error summary without dumping whole sheets
            newest=$(sudo ls -t /var/www/uploader/jobs/job_*.json 2>/dev/null | head -1 || true)
            if [ -n "$newest" ]; then
              echo "Newest job file: $newest"
              sudo php -r '$j=json_decode(file_get_contents($argv[1]),true); echo "status=".($j["status"]??"")." error=".($j["error"]??"")." failedUrl=".substr(($j["failedUrl"]??""),0,120)."
"; $e=$j["errors"]??[]; echo "errors=".count($e)."
"; if($e){ $x=end($e); echo "lastErr=".($x["error"]??"")." detail=".substr(($x["detail"]??""),0,200)."
"; }' "$newest" || true
            fi
            echo "Uploader tree:"
            ls -la /var/www/uploader | head -30
            ls -la /var/www/uploader/jobs 2>/dev/null | head -20 || true

            # Reload nginx ASAP so /jobs/*.csv works even if Salaris steps fail.
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx || true
              sudo systemctl enable --now php8.3-fpm 2>/dev/null || sudo systemctl restart php*-fpm 2>/dev/null || true
            fi

            # Salaris API (vendored from ASAP-Serg/SalarisDisabledRemover) → https://ooneclickk.ru/salaris
            SALARIS_DIR=/srv/salaris-api
            set +e
            if [ -d deploy/salaris-src ]; then
              sudo mkdir -p "$SALARIS_DIR"
              # Keep server .env and chrome profile across deploys.
              sudo rsync -a --delete \
                --exclude '.env' --exclude 'chrome-user-data/' --exclude '.git/' \
                deploy/salaris-src/ "$SALARIS_DIR/"
              # Prefer GitHub Secrets → /srv/salaris-api/.env (no manual SSH).
              if [ -n "${SALARIS_API_KEY:-}" ]; then
                python3 deploy/write-salaris-env.py
                sudo mv /tmp/salaris.env "$SALARIS_DIR/.env"
                sudo chmod 600 "$SALARIS_DIR/.env"
                sudo chown root:root "$SALARIS_DIR/.env"
                echo "Salaris .env synced from GitHub Secrets"
              elif [ ! -f "$SALARIS_DIR/.env" ]; then
                if [ -f deploy/salaris.env.example ]; then
                  sudo cp deploy/salaris.env.example "$SALARIS_DIR/.env"
                elif [ -f "$SALARIS_DIR/.env.example" ]; then
                  sudo cp "$SALARIS_DIR/.env.example" "$SALARIS_DIR/.env"
                fi
                echo "WARN: set GitHub Secrets SALARIS_* then redeploy (see deploy/salaris.env.example)"
              fi
              if [ -f deploy/nginx/salaris-proxy.snippet.conf ]; then
                sudo cp deploy/nginx/salaris-proxy.snippet.conf /etc/nginx/snippets/salaris-proxy.conf
                for conf in /etc/nginx/sites-enabled/ooneclickk.ru /etc/nginx/sites-available/ooneclickk.ru; do
                  if [ -f "$conf" ] && ! grep -q 'snippets/salaris-proxy.conf' "$conf"; then
                    sudo sed -i '/location \/ {/i\    include snippets/salaris-proxy.conf;\n' "$conf" || true
                  fi
                done
              fi
              if command -v docker >/dev/null 2>&1; then
                if docker compose version >/dev/null 2>&1; then
                  SDC="docker compose"
                else
                  SDC="docker-compose"
                fi
                (cd "$SALARIS_DIR" && sudo $SDC up -d --build) || echo "WARN: salaris compose failed (check .env / RAM)"
                (cd "$SALARIS_DIR" && sudo $SDC ps) || true
              fi
              if command -v nginx >/dev/null 2>&1; then
                sudo nginx -t && sudo systemctl reload nginx || true
              fi
            else
              echo "WARN: deploy/salaris-src missing"
            fi
            set -e

            echo "Deploy OK ${{ github.sha }}"
