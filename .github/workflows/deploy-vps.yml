name: Deploy VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Personal AdminVPS only. Never run against the org copy.
jobs:
  deploy:
    if: github.repository == 'ASAP-Serg/Nano-banana'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AdminVPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"
            echo "Deploy path: $(pwd)"
            echo "Target SHA: ${{ github.sha }}"

            git remote -v
            git fetch origin master
            git reset --hard "${{ github.sha }}"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing on server"
              exit 1
            fi
            if ! grep -qE '^REDIS_PASSWORD=.+' .env; then
              echo "ERROR: REDIS_PASSWORD empty in .env"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # Avoid "removal already in progress" races when a previous deploy
            # or manual restart is mid-recreate.
            $DC stop api worker web migrate 2>/dev/null || true
            docker rm -f nano_banana_migrate nano_banana_worker nano_banana_api nano_banana_web 2>/dev/null || true
            sleep 2

            up_ok=0
            for attempt in 1 2 3; do
              if $DC up -d --build --remove-orphans; then
                up_ok=1
                break
              fi
              echo "compose up failed (attempt $attempt), retrying…"
              sleep 5
              docker rm -f nano_banana_migrate nano_banana_worker nano_banana_api nano_banana_web 2>/dev/null || true
            done
            if [ "$up_ok" -ne 1 ]; then
              echo "ERROR: docker compose up failed after retries"
              exit 1
            fi

            sleep 25
            $DC ps

            missing=0
            for name in nano_banana_api nano_banana_worker nano_banana_web nano_banana_redis nano_banana_postgres; do
              if ! docker ps --format '{{.Names}}' | grep -qx "$name"; then
                echo "ERROR: $name is not running"
                docker logs "$name" --tail 80 2>/dev/null || true
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || echo 000)
            echo "Healthz: HTTP $code"
            if [ "$code" != "200" ]; then
              docker logs nano_banana_api --tail 100
              docker logs nano_banana_web --tail 40
              exit 1
            fi

            # Host nginx configs live on the VPS (not in git). Reload if present.
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            echo "Deploy OK ${{ github.sha }}"
