name: Deploy Beget

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Only the personal VPS repo. The company copy must not SSH anywhere.

jobs:
  deploy:
    if: github.repository == 'ASAP-Serg/Nano-banana'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Beget
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "Deploy path: $(pwd)"

            git fetch origin master
            git reset --hard "${{ github.sha }}"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing"
              exit 1
            fi
            if ! grep -qE '^REDIS_PASSWORD=.+' .env; then
              pw="$(openssl rand -hex 24)"
              if grep -qE '^REDIS_PASSWORD=' .env; then
                sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=${pw}/" .env
              else
                printf '\nREDIS_PASSWORD=%s\n' "$pw" >> .env
              fi
              echo "Generated REDIS_PASSWORD in .env (required for Redis AUTH)"
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            docker rm -f nano_banana_migrate 2>/dev/null || true
            $DC up -d --build --remove-orphans
            sleep 20
            $DC ps

            if [ -f deploy/nginx/storage.ooneclickk.ru.conf ]; then
              cp deploy/nginx/storage.ooneclickk.ru.conf /etc/nginx/sites-available/storage.ooneclickk.ru
              nginx -t
            fi

            missing=0
            for name in nano_banana_api nano_banana_worker nano_banana_web nano_banana_redis; do
              if ! docker ps --format '{{.Names}}' | grep -qx "$name"; then
                echo "ERROR: $name is not running"
                docker logs "$name" --tail 80 2>/dev/null || true
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || echo 000)
            echo "Healthz: HTTP $code"
            if [ "$code" != "200" ]; then
              docker logs nano_banana_api --tail 80
              docker logs nano_banana_web --tail 40
              exit 1
            fi

            systemctl reload nginx || true
            echo "Deploy OK"
