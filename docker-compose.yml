# Beget / VPS: тот же стек, что локально, но порты только на localhost.
# Хостовый nginx как раньше проксирует на 127.0.0.1:8000 — это теперь web,
# а /api внутри контейнера уходит в FastAPI. Postgres/MinIO volumes те же.
# Локальная разработка: docker compose -f deploy/compose/docker-compose.yml up --build

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  MINIO_ENDPOINT: minio:9000

services:
  postgres:
    image: postgres:15-alpine
    container_name: nano_banana_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nano_banana}
      POSTGRES_USER: ${POSTGRES_USER:-nano_banana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nano_banana_user} -d ${POSTGRES_DB:-nano_banana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nano_banana_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nano_banana_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nano_banana_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nano_banana_minio
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://127.0.0.1:9001}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nano_banana_network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: nano_banana_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/nano-banana-images --ignore-existing;
      mc anonymous set none local/nano-banana-images;
      exit 0;
      "
    networks:
      - nano_banana_network

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: nano_banana_migrate
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nano_banana_network

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: nano_banana_api
    command: uvicorn nano_banana_api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - nano_banana_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: nano_banana_worker
    command: python -m nano_banana_worker
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - nano_banana_network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NGINX_CONF: deploy/nginx/web.compose.conf
    container_name: nano_banana_web
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - api
    networks:
      - nano_banana_network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  nano_banana_network:
    driver: bridge
